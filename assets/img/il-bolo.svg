<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 76 280 210" role="img" aria-label="Ilustração de bolo artesanal de camadas">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F3E6D4"/>
    </linearGradient>
    <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0CFA6"/>
      <stop offset="1" stop-color="#DDB181"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7E2CE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F7E2CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grape" cx="34%" cy="28%" r="75%">
      <stop offset="0" stop-color="#C6DB7E"/>
      <stop offset="1" stop-color="#7FA83F"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="262" rx="96" ry="12" fill="#8B6B4A" opacity="0.14"/>
  <!-- stand -->
  <path d="M96 236h208c0 10-8 16-18 18H114c-10-2-18-8-18-18z" fill="#E5D3BE"/>
  <path d="M188 214h24v22h-24z" fill="#DCC8B0"/>
  <ellipse cx="200" cy="214" rx="18" ry="5" fill="#EADCC9"/>
  <!-- cake body -->
  <path d="M104 220v-74c0-8 6-12 14-12h164c8 0 14 4 14 12v74z" fill="url(#cream)"/>
  <g>
    <path d="M104 162h192v16H104z" fill="url(#sponge)"/>
    <path d="M104 188h192v14H104z" fill="url(#sponge)"/>
    <path d="M104 210h192v10H104z" fill="url(#sponge)"/>
    <path d="M104 176h192v8H104z" fill="#F7ECDC"/>
    <path d="M104 200h192v8H104z" fill="#F7ECDC"/>
  </g>
  <ellipse cx="200" cy="146" rx="96" ry="16" fill="#FFFDF8"/>
  <ellipse cx="200" cy="146" rx="96" ry="16" fill="none" stroke="#EFDFCB" stroke-width="1.5"/>
  <!-- piped cream rosettes -->
  <g fill="#FFF9F0" stroke="#EFDFCB" stroke-width="1">
    <circle cx="128" cy="142" r="9"/><circle cx="164" cy="138" r="9"/>
    <circle cx="236" cy="138" r="9"/><circle cx="272" cy="142" r="9"/>
  </g>
  <!-- grapes -->
  <g>
    <g fill="url(#grape)" stroke="#6E9831" stroke-width="1">
      <circle cx="188" cy="122" r="11"/><circle cx="210" cy="118" r="11"/>
      <circle cx="199" cy="136" r="11"/><circle cx="176" cy="134" r="9"/>
      <circle cx="221" cy="132" r="9"/>
    </g>
    <path d="M200 112c4-14 16-22 30-24-2 12-12 22-24 25" fill="#8CB548"/>
    <path d="M204 116c-6-10-6-20-2-28 6 8 9 18 8 27" fill="#7FA83F"/>
  </g>
  <!-- pink flower -->
  <g transform="translate(240 128)">
    <g fill="#F6C9D2">
      <circle cx="0" cy="-7" r="6"/><circle cx="6" cy="2" r="6"/>
      <circle cx="-6" cy="2" r="6"/><circle cx="3" cy="8" r="5"/><circle cx="-3" cy="8" r="5"/>
    </g>
    <circle cx="0" cy="1" r="3.4" fill="#E7A93F"/>
  </g>
</svg>
